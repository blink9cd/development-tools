[build-system]
# 77 is the first setuptools to accept the SPDX `license` string in [project] (PEP 639).
# Bounded below 85: `pip install '.[test]'` into a fresh Python 3.12 venv resolved
# setuptools 84.2.1 and installed cleanly, and a new major may change how it reads this
# flat layout.
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "development-tools"
version = "0.2.0"
description = "Tools for working with a git workspace: a daily, verified backup of a checkout's un-pushed work to iCloud Drive"
readme = "README.md"
license = "AGPL-3.0-or-later"
# The oldest interpreter the suites have been run on. The ruff and mypy targets below
# follow it: a newer gate target would pass syntax and standard-library names that are an
# error here.
requires-python = ">=3.12"
# Deliberately empty: every tool and library here is standard-library only at runtime.
dependencies = []

[project.optional-dependencies]
# The property tests in git_workspace_backup/tests/ and the vendored libraries' suites.
# Tests only: nothing at runtime imports it.
test = ["hypothesis==6.165.10"]

[tool.setuptools]
# Deliberately empty. The tool is run directly and puts its sibling folders on sys.path,
# so nothing here is imported from an installed location: installing this distribution
# installs its metadata and whichever extra is asked for, never code. Left to
# auto-discovery, setuptools refuses this flat layout of sibling folders outright.
packages = []

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
# The Python blocks inside the Markdown docs are laid out by hand (a call shown before
# and after on a few lines, an API table aligned in columns), and ruff's formatter would
# reflow them into one argument per line. The docs keep their layout; every .py file is
# still held to the formatter.
exclude = ["*.md"]

[tool.ruff.lint]
# E4/E7/E9/F are ruff's classic default set, written out so the enabled rules are a
# function of this file rather than of whichever ruff release is installed. PGH003 and
# PGH004 flag a bare `# type: ignore` or `# noqa`, one that names no rule code. D adds the
# docstring rules (pep257), minus D401's imperative-mood opinion, which flags valid
# noun-phrase summaries.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004", "D"]
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names say what each test does; a docstring per test would be noise.
"**/test_*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The backup and the libraries put these folders on sys.path at runtime, each from its own
# file's location; mypy cannot see a runtime insert, so they are named here for it. Each
# library's private src/ is put there by the library itself when it loads.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/stdio_utf8",
  "$MYPY_CONFIG_FILE_DIR/help_formatter",
  "$MYPY_CONFIG_FILE_DIR/bounded_run",
  "$MYPY_CONFIG_FILE_DIR/bounded_run/src",
  "$MYPY_CONFIG_FILE_DIR/os_schedule_gen",
  "$MYPY_CONFIG_FILE_DIR/os_schedule_gen/src",
  "$MYPY_CONFIG_FILE_DIR/atomic_write",
  "$MYPY_CONFIG_FILE_DIR/pyproject_config",
  "$MYPY_CONFIG_FILE_DIR/live_pid_guard",
]

[tool.coverage.run]
# Branch coverage, not line coverage: a line can run while one side of its condition
# never does. The two runtime __main__ guards, git_workspace_backup.py's and
# os_schedule_gen.py's, each carry their own `# pragma: no cover`; the others sit in test
# files, which are run rather than measured.
branch = true

[tool.coverage.report]
# `# pragma: only-on posix` marks a line only a POSIX host runs, and
# `# pragma: only-on win32` one only Windows runs. Each is excluded on the other kind of
# host alone, so both stay measured where they run. coverage.py's configuration can read
# environment variables but not the platform, so it keys on OS: Windows sets it to
# Windows_NT in every process and POSIX systems leave it unset, so a set OS reads as
# Windows. With OS unset, ${OS-} is empty: the first pattern ends in (?!), which never
# matches, and the second is plain. With OS set, the first matches, and the second would
# need "win32" to run straight into "Windows_NT" across a word boundary, which cannot
# happen. exclude_also adds to coverage.py's default patterns, so `# pragma: no cover`
# keeps working.
exclude_also = [
  'pragma:\s*only-on\s+posix\b(?!${OS-})',
  'pragma:\s*only-on\s+win32\b${OS-}',
]
